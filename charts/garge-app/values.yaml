replicaCount: 1

image:
  repository: sondresjo/garge-app
  pullPolicy: IfNotPresent
  tag: "v1.28.0@sha256:dca6cb455468960d9a3e16cad0140f5ee3ed119d236ab6699f3c9614c1071a5c"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount: {}

automountServiceAccountToken: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

startupProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 5
  failureThreshold: 12

readinessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: garge.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

env: []
